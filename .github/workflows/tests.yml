name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Self-test (pure Java part, no FTC SDK needed)
        run: |
          javac --release 8 -d out src/org/asa/tools/core/*.java src/org/asa/tools/blackbox/*.java test/BlackBoxSelfTest.java
          java -cp out BlackBoxSelfTest
      - name: FTC Dashboard bridge (with a Dashboard look-alike on the classpath)
        run: |
          javac --release 8 -d out-dash src/org/asa/tools/core/*.java $(find test/fakes -name '*.java') test/DashboardTest.java
          java -cp out-dash DashboardTest
      - name: Battery health, hub resets, loop profiler, crash capture, center of gravity
        run: |
          javac --release 8 -d out-feat src/org/asa/tools/core/*.java src/org/asa/tools/blackbox/*.java test/BlackBoxFeaturesTest.java
          java -cp out-feat BlackBoxFeaturesTest
      - name: Remove ASA deletes only ASA files - never a team's file, never what SysId needs, nothing while used
        run: |
          javac --release 8 -d out-rm src/org/asa/tools/core/*.java src/org/asa/tools/blackbox/*.java test/RemoverTest.java
          java -cp out-rm RemoverTest
      - name: Detectors - overheating, wheel dragging, frozen IMU, loop pause, gamepad lost, low battery at start
        run: |
          javac --release 8 -d out-det src/org/asa/tools/core/*.java src/org/asa/tools/blackbox/*.java test/BlackBoxDetectorsTest.java
          java -cp out-det BlackBoxDetectorsTest
      - name: Monte Carlo - 300 random matches with injected stalls, lost encoders, brownouts, slow loops
        run: |
          javac --release 8 -d out-fuzz src/org/asa/tools/core/*.java src/org/asa/tools/blackbox/*.java test/BlackBoxFuzz.java
          java -cp out-fuzz BlackBoxFuzz 300 1
      - name: Soak - 60000 rows, 40 signals; no drops, flat memory, intact files, WPILOG export
        run: |
          javac --release 8 -d out-soak src/org/asa/tools/core/*.java src/org/asa/tools/blackbox/*.java test/SoakTest.java
          java -Xmx256m -cp out-soak SoakTest
